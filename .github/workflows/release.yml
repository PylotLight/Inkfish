name: release

# Triggered by pushing a version tag (v*), e.g. `bun run release --push`.
# Builds the artifacts, publishes a GitHub release with generated notes,
# then updates the Homebrew cask in this repo (it doubles as the tap), then
# publishes the bunx/npx launcher to npm (gated by the NPM_PUBLISH repo variable).
#
# Pre-release tags (anything with a '-', e.g. v0.2.15-beta.1 from `release.ts --pre`)
# are test builds: GitHub pre-release (never "latest"), notes say so. The Homebrew
# cask is updated like a stable release (brew users get the test build); the npm
# job is skipped, so bunx users never get them. The app only offers them with
# "Include pre-releases" on (src/shared/update-feed.ts).
# See docs/releasing.md.
# Workflows register from the default branch (main).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: 'Inkfish · Release · build ${{ matrix.name }} · ${{ github.ref_name }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS only for now. To bring Linux back, re-add a matrix entry:
          #   - name: linux
          #     os: ubuntu-latest
          #     target: --linux
          # (plus a libfuse apt step for AppImage — see git history).
          # Repo variable INKFISH_MAC_RUNNER points this at a self-hosted Mac (default macos-15).
          - name: macos
            os: ${{ vars.INKFISH_MAC_RUNNER || 'macos-15' }}
            target: --mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # Newest Xcode on the image: Swift 6.2 + macOS 26 SDK enables the
      # SpeechAnalyzer engine (older SDKs build a stub). FluidAudio needs Swift 6.
      # Falls back to the current Xcode on a self-hosted Mac without sudo.
      - name: select xcode
        if: matrix.name == 'macos'
        run: bash .github/scripts/select-xcode.sh

      # SwiftPM build dir for the transcription helper: `bun run build` spends ~3 min
      # compiling FluidAudio etc. from scratch otherwise. Tag builds can read caches saved
      # on main (ci.yml's mac-stt job seeds it whenever stt/ changes).
      - name: restore SwiftPM build cache
        if: matrix.name == 'macos'
        uses: actions/cache@v4
        with:
          path: stt/.build
          key: stt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stt/Package.swift', 'stt/Package.resolved') }}-${{ hashFiles('stt/Sources/**') }}
          restore-keys: stt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('stt/Package.swift', 'stt/Package.resolved') }}-

      # bun packages + the Electron zips @electron/get and electron-builder download.
      - name: restore bun + electron caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: release-${{ runner.os }}-${{ runner.arch }}-

      # bun only speaks http(s) proxies: a self-hosted runner with HTTP(S)_PROXY=socks5://... fails with
      # UnsupportedProxyProtocol on any uncached package (a new Electron, say). Go direct for bun only
      # (same fix as Surffish scripts/ci/bun-install-mac.sh). No-op on GitHub-hosted runners.
      - name: bun install
        run: |
          for v in HTTPS_PROXY https_proxy HTTP_PROXY http_proxy ALL_PROXY all_proxy; do
            case "${!v:-}" in socks*://*) echo "unset $v for bun (socks proxy)"; unset "$v" ;; esac
          done
          bun install --frozen-lockfile
      # Also builds the transcription helper (stt/bin/inkfish-stt), bundled as
      # Contents/Resources/bin/inkfish-stt via build.mac.extraResources.
      - run: bun run build

      # Unsigned on macOS unless CSC_* secrets are configured — see
      # docs/releasing.md ("Code signing"). Brew casks work either way.
      - name: package
        run: bun run dist:ci -- ${{ matrix.target }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.dmg
          if-no-files-found: error

  release:
    name: 'Inkfish · Release · github release · ${{ github.ref_name }}'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff needs full history and tags

      - name: install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: generate release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pre=false; case "$TAG" in *-*) pre=true ;; esac
          echo "pre=$pre" >> "$GITHUB_OUTPUT"
          # Everything since the previous *stable* tag: a beta lists all it adds over the last release,
          # and the final release after betas covers them too (cliff.toml ignore_tags folds beta tags in).
          # A range instead of --latest, which picks the wrong span once ignored beta tags exist.
          # PREV = newest stable tag below this tag's X.Y.Z.
          BASE="${TAG%%-*}"
          PREV=$( { git tag --list 'v[0-9]*' | grep -v -- '-'; echo "$BASE"; } | sort -uV | grep -B1 -x "$BASE" | head -1)
          [ "$PREV" = "$BASE" ] && PREV=""
          git-cliff ${PREV:+"$PREV..$TAG"} --tag "$TAG" --strip all --output CLIFF.md
          {
            if [ "$pre" = true ]; then
              echo "> **test build** (pre-release${PREV:+, changes since $PREV}). Not offered to normal installs: only Macs with Settings → About & updates → Beta updates on see it. The Homebrew cask is updated to this build; no npm update."
              echo
            fi
            cat CLIFF.md
            # Which phone build this Mac build was tested against: newest stable android-v* tag
            # (newest android tag of any kind for a test build).
            if [ "$pre" = true ]; then ANDROID=$(git -c versionsort.suffix=- tag --list 'android-v*' --sort=-v:refname | head -1 || true)
            else ANDROID=$(git tag --list 'android-v*' --sort=-v:refname | grep -v -- '-.*-' | head -1 || true); fi
            if [ -n "$ANDROID" ]; then printf '\ntested with %s\n' "$ANDROID"; fi
          } > RELEASE_NOTES.md
          rm CLIFF.md
          cat RELEASE_NOTES.md

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.pre == 'true' && format('{0} (test build)', github.ref_name) || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          prerelease: ${{ steps.notes.outputs.pre == 'true' }}
          # a test build must never become "latest" (the cask, `bunx …@latest` and /releases/latest read it)
          make_latest: ${{ steps.notes.outputs.pre == 'true' && 'false' || 'legacy' }}
          fail_on_unmatched_files: true

  # This repo doubles as the Homebrew tap (brew taps any repo with a Casks/
  # dir via `brew tap pylotlight/inkfish <url>`). The job updates
  # Casks/inkfish.rb on main with the built-in GITHUB_TOKEN — no extra
  # secrets. Token pushes don't re-trigger workflows, so no loop.
  homebrew:
    name: 'Inkfish · Release · homebrew cask · ${{ github.ref_name }}'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: download macos artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist

      - name: resolve version and checksums
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=$version"
            echo "sha256_arm=$(shasum -a 256 "dist/Inkfish-${version}-mac-arm64.zip" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: render cask
        run: |
          bun scripts/render-cask.ts \
            --version "${{ steps.meta.outputs.version }}" \
            --sha256-arm "${{ steps.meta.outputs.sha256_arm }}" \
            --out Casks/inkfish.rb

      - name: commit and push cask update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/inkfish.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
          else
            git commit -m "chore(tap): inkfish ${{ steps.meta.outputs.version }}"
            git push
          fi

  # bunx/npx launcher (packages/cli -> @pylotlight/inkfish on npm), published only after the GitHub
  # release + cask bump above succeeded. GitHub-hosted on purpose: npm trusted publishing (OIDC, no
  # NPM_TOKEN) doesn't support self-hosted runners. Gated by the repo variable NPM_PUBLISH=true:
  # until then every release does a dry run (stamp + `npm publish --dry-run`, no auth) and warns,
  # so the job gets exercised without publishing anything (packages/cli/DEVELOPING.md#publishing).
  # Skipped for pre-release tags: npm versions can never be reused once published and a slip in the
  # dist-tag would move `latest` for every bunx user, while testers get the Mac build from the GitHub
  # pre-release anyway. (The `next` dist-tag below stays as a backstop.)
  npm:
    name: 'Inkfish · Release · npm launcher · ${{ github.ref_name }}'
    needs: homebrew
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    env:
      NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
      PKG: '@pylotlight/inkfish'
    steps:
      - uses: actions/checkout@v4

      - name: publish or dry run?
        id: gate
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$app" ]; then echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $app"; exit 1; fi
          if [ "$NPM_PUBLISH" = "true" ]; then mode=publish
          else
            mode=dry
            echo "::warning::npm publish is off (dry run only): set the repo variable NPM_PUBLISH=true once ${PKG} exists on npm with release.yml as its trusted publisher (packages/cli/DEVELOPING.md#publishing)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "npm: $mode ${PKG}@${version}"

      # trusted publishing minimums: Node >= 22.14, npm >= 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm >= 11.5.1
        run: |
          if ! node -e 'const v=require("child_process").execSync("npm -v").toString().trim().split(".").map(Number);process.exit(v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1)))?0:1)'; then
            # a global prefix that isn't writable fails with EACCES (Surffish #267), so install into a user prefix
            prefix="$RUNNER_TEMP/npm-global"
            npm install -g --prefix "$prefix" --no-fund --no-audit npm@^11.5.1
            echo "$prefix/bin" >> "$GITHUB_PATH"
            export PATH="$prefix/bin:$PATH"
            hash -r
          fi
          echo "node $(node -v), npm $(npm -v)"

      - name: stamp packages/cli (version + release.json with the zip's SHA-256)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node packages/cli/scripts/prepare-publish.mjs --version "$VERSION" --verify-download
          node packages/cli/bin/inkfish.mjs --version
          node packages/cli/bin/inkfish.mjs --help >/dev/null

      - name: npm publish ${{ env.PKG }}
        working-directory: packages/cli
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          tag=latest; case "$VERSION" in *-*) tag=next ;; esac
          if [ "$MODE" = "dry" ]; then
            npm publish --dry-run --access public --tag "$tag" || { echo "::warning::npm publish --dry-run refused (version already on npm?), showing npm pack instead"; npm pack --dry-run; }
            exit 0
          fi
          # npm view needs no auth for a public package; failure = the package doesn't exist yet
          if ! npm view "$PKG" name >/dev/null 2>&1; then
            echo "::warning::${PKG} isn't on npm yet. Trusted publishing can only be set up on an existing package: do the one-time manual first publish (packages/cli/DEVELOPING.md#publishing); later releases then publish here."
            exit 0
          fi
          if [ "$(npm view "$PKG@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "::notice::${PKG}@${VERSION} is already on npm, nothing to do"
            exit 0
          fi
          npm publish --provenance --access public --tag "$tag"
          echo "::notice::published ${PKG}@${VERSION} (bunx ${PKG}@${VERSION})"
