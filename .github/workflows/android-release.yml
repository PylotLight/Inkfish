name: android-release

# Signed Android APK → GitHub Release, picked up by the app's in-app updater
# (android/src/lib/updater.ts). A tag with a '-' (android-vX.Y.Z-beta.N, from
# `release.ts --pre`) is a test build: GitHub pre-release, notes say so, and the
# app only offers it with Settings › Updates › Beta updates on.
# Trigger: push a tag `android-vX.Y.Z`
#   git tag android-v0.2.0 && git push origin android-v0.2.0
# or run manually with a version. The Mac release workflow only matches `v*`. Android
# releases are always GitHub pre-releases (a separate channel), so /releases/latest —
# read by the CLI launcher, the README badge and the cask — always stays a desktop
# release. The in-app updater reads the releases list, so it is unaffected.
#
# Secrets (same keystore as the cluster build — never rotate it):
#   ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 or 0.2.1-beta.1 (creates tag android-v<version>; a '-' makes it a pre-release)"
        required: true

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    name: "Inkfish · Android release · apk · ${{ github.event.inputs.version && format('android-v{0} (manual)', github.event.inputs.version) || github.ref_name }}"
    # Repo variable INKFISH_ANDROID_RUNNER points this at a self-hosted Linux runner
    # (needs ~8 GB RAM for gradle). Default ubuntu-latest.
    runs-on: ${{ vars.INKFISH_ANDROID_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#android-v}"; fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "version must be X.Y.Z or X.Y.Z-beta.N, got '$V'"; exit 1; }
          PRE=false; [[ "$V" == *-* ]] && PRE=true
          # versionCode from X.Y.Z only: a beta shares its final's code, so beta → beta → final each
          # install over the last (Android only refuses a *lower* code) and stable phones still upgrade.
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          CODE=$((MA * 10000 + MI * 100 + PA))
          { echo "version=$V"; echo "code=$CODE"; echo "pre=$PRE"; } >> "$GITHUB_OUTPUT"
          jq --arg v "$V" --argjson c "$CODE" '.expo.version=$v | .expo.android.versionCode=$c' app.json > app.tmp && mv app.tmp app.json
          echo "Inkfish Android $V (versionCode $CODE)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # setup-gradle only writes its cache from the default branch unless told otherwise, and
      # this workflow only runs on tags, so every release used to start with a cold gradle cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Self-hosted runners don't ship the Android SDK; hosted ones do (ANDROID_HOME set).
      # `env.ANDROID_HOME` in an `if:` only sees workflow-level env (always empty), so check the
      # runner's real env in a shell step instead.
      - name: has android sdk?
        id: sdk
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"

      # The legacy `tools` package (setup-android's default) is gone from Google's SDK repo,
      # so only ask for platform-tools; gradle pulls platforms/build-tools itself.
      - name: android sdk (only if the runner lacks one)
        if: steps.sdk.outputs.present != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: restore android/node_modules
        id: android-nm
        uses: actions/cache@v4
        with:
          path: android/node_modules
          key: android-nm-release-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('android/package-lock.json') }}

      - if: steps.android-nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KS" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret missing (see android/build/README.md)"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/inkfish.keystore"

      - name: prebuild + sign
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/inkfish.keystore
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          npx expo prebuild --platform android --clean
          ./build/inject-signing.sh

      - name: assemble
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/inkfish.keystore
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          ./gradlew :app:assembleRelease -Dorg.gradle.jvmargs=-Xmx4g --console=plain
          OUT="$GITHUB_WORKSPACE/Inkfish-android-${{ steps.v.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT"apksigner verify --print-certs "$OUT" | head -4
          ls -la "$OUT"

      - name: notes
        working-directory: .
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # since the previous *stable* android tag (betas skipped), so the final after betas covers them
          # (PREV = newest stable android tag below this version's X.Y.Z)
          BASE="android-v${VERSION%%-*}"
          PREV=$( { git tag --list 'android-v*' | grep -vE '^android-v[0-9]+\.[0-9]+\.[0-9]+-'; echo "$BASE"; } | sort -uV | grep -B1 -x "$BASE" | head -1)
          [ "$PREV" = "$BASE" ] && PREV=""
          RANGE=${PREV:+$PREV..HEAD}
          {
            echo "Inkfish for Android ${{ steps.v.outputs.version }}"
            echo
            if [ "${{ steps.v.outputs.pre }}" = true ]; then
              echo "> **test build** (pre-release${PREV:+, changes since $PREV}). Only phones with Settings › Updates › Beta updates on are offered it."
              echo
            fi
            git log ${RANGE:-HEAD} --no-merges --pretty='- %s' -- android src/shared | head -40
            # Which Mac build this phone build was tested against (newest stable v* tag, android-v* excluded;
            # newest v* of any kind for a test build).
            if [ "${{ steps.v.outputs.pre }}" = true ]; then MAC=$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-v:refname | head -1 || true)
            else MAC=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-' | head -1 || true); fi
            if [ -n "$MAC" ]; then echo; echo "tested with $MAC"; fi
          } > ANDROID_NOTES.md
          cat ANDROID_NOTES.md

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.v.outputs.version }}
          name: Android ${{ steps.v.outputs.version }}${{ steps.v.outputs.pre == 'true' && ' (test build)' || '' }}
          body_path: ANDROID_NOTES.md
          # Always a pre-release: a stable android release would become /releases/latest
          # (GitHub computes that from non-pre-releases regardless of make_latest) and
          # break the CLI launcher's latest-resolution, the badge and the cask.
          prerelease: true
          make_latest: 'false'
          files: Inkfish-android-${{ steps.v.outputs.version }}.apk
