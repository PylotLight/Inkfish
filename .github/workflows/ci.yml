name: ci

# Fast path for PRs and main. Runs on GitHub-hosted runners by default; point it at
# self-hosted ones with repo variables (Settings → Secrets and variables → Actions → Variables):
#   INKFISH_LINUX_RUNNER  runs-on label for Linux jobs (e.g. an ARC scale set name). Default ubuntu-latest.
#   INKFISH_MAC_RUNNER    runs-on label for the macOS job. Default xcode-27 (macOS 27 + Xcode 27).
#   INKFISH_CI_CACHE      optional persistent dir on the runner (or mount a writable /cache) to keep
#                         bun/npm/Electron download caches across ephemeral pods.
# The repo is public: when a self-hosted label is set, fork PRs are skipped so untrusted code
# never runs on our boxes (hosted runners still run them).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Casks/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Casks/**'
      - 'LICENSE'
  workflow_dispatch:

# One run per PR (or per ref); a new push to a PR cancels the stale run. main never cancels.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files through the API

jobs:
  # Which parts of the repo changed, so the Android and macOS jobs only run when they matter.
  changes:
    name: "Inkfish · CI · detect changes · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) || github.ref_name || github.event_name }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.INKFISH_LINUX_RUNNER == ''
    runs-on: ${{ vars.INKFISH_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
      stt: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.stt == 'true' }}
      onnx: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.onnx == 'true' }}
    steps:
      # PRs are diffed through the API (no checkout); pushes to main need history to diff against.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            android:
              - 'android/**'
              - 'src/shared/**'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            stt:
              - 'stt/**'
              - 'scripts/build-stt.ts'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            onnx:
              - 'package.json'
              - 'bun.lock'
              - 'src/main/onnx-managed.ts'
              - 'src/main/onnx-managed.test.ts'
              - 'src/main/intel-local.ts'
              - 'src/main/intel-local.test.ts'
              - 'src/main/intelligence.ts'
              - 'src/main/ipc.ts'
              - 'src/main/index.ts'
              - 'src/preload/index.ts'
              - 'src/renderer/src/views/IntelligenceSettings.tsx'
              - 'src/shared/managed-onnx.ts'
              - 'src/shared/lfm-catalog.ts'
              - 'src/shared/intel-runtime.ts'
              - 'src/shared/intel-bench.ts'
              - 'src/shared/intel-bench.test.ts'
              - 'scripts/bench-intelligence.ts'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'

  # test + typecheck + build in one job: together they take ~5 s, far less than the setup a
  # second job would repeat, so splitting or sharding bun test (79 tests, <1 s) would be slower.
  verify:
    name: "Inkfish · CI · test + typecheck + build · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) || github.ref_name || github.event_name }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.INKFISH_LINUX_RUNNER == ''
    runs-on: ${{ vars.INKFISH_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: persistent cache dir (self-hosted only, if one is mounted)
        run: bash .github/scripts/ci-cache-env.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: restore bun install cache
        if: env.CI_PERSISTENT_CACHE != '1'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      # --ignore-scripts skips the root postinstall (the ~100 MB Electron binary download):
      # tests, typecheck and the electron-vite build never launch Electron.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun test
      - run: bun run typecheck
      - run: bun run build

  lint-format:
    name: "Inkfish · CI · lint + format · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) || github.ref_name || github.event_name }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.INKFISH_LINUX_RUNNER == ''
    runs-on: ${{ vars.INKFISH_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Bun's built-in linter is checked against the rolling canary channel.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: lint
        run: bun lint
      - name: format check
        run: bun run format:check

  # bunx/npx launcher (packages/cli, published as @pylotlight/inkfish by release.yml). Its own tiny
  # job: no bun install, no Electron. Unit tests (also part of `bun test` above), a smoke of the bin
  # under Bun and Node, and the release job's stamp + `npm pack --dry-run` against the latest release.
  cli:
    name: "Inkfish · CI · cli launcher · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) || github.ref_name || github.event_name }}"
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.INKFISH_LINUX_RUNNER == ''
    runs-on: ${{ vars.INKFISH_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: unit tests (version resolution, checksums, cache path, uninstall, local download e2e)
        run: bun run test:cli
      - name: the bin runs under Bun, and under Node when the runner has it
        run: |
          bun packages/cli/bin/inkfish.mjs --version
          bun packages/cli/bin/inkfish.mjs --help >/dev/null
          if command -v node >/dev/null && ! node -e 'process.exit(process.versions.bun ? 0 : 1)'; then
            node packages/cli/bin/inkfish.mjs --version
          else
            echo "no Node.js on this runner, Bun only"
          fi
          # unsupported-platform path: friendly message, exit 1, no network
          if bun packages/cli/bin/inkfish.mjs; then echo "::error::expected exit 1 on linux"; exit 1; fi
      - name: stamp + pack like release.yml (newest desktop release, no publish)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Newest desktop release (vX.Y.Z, beta or stable) — not /releases/latest, which
          # excludes prereleases (empty while only betas exist) and can pick up
          # non-desktop releases.
          tag="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=30" | bun -e 'const rs = JSON.parse(await Bun.stdin.text()); const t = rs.find((r) => /^v\d+\.\d+\.\d+/.test(r.tag_name)); console.log(t ? t.tag_name : "")')"
          [ -n "$tag" ] || { echo "::error::no desktop release found to stamp"; exit 1; }
          bun packages/cli/scripts/prepare-publish.mjs --version "${tag#v}"
          bun packages/cli/bin/inkfish.mjs --version
          cd packages/cli
          bunx npm pack --dry-run 2>&1 | tee pack.txt
          grep -q 'release.json' pack.txt || { echo "::error::release.json missing from the pack"; exit 1; }
          if grep -q 'test/' pack.txt; then echo "::error::tests leaked into the pack"; exit 1; fi

  typecheck-android:
    name: "Inkfish · CI · android tests + typecheck · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) || github.ref_name || github.event_name }}"
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ${{ vars.INKFISH_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: persistent cache dir (self-hosted only, if one is mounted)
        run: bash .github/scripts/ci-cache-env.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: restore bun install cache
        if: env.CI_PERSISTENT_CACHE != '1'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      # android/node_modules keyed on the lockfile: a hit skips npm ci (~13 s) entirely.
      - name: restore android/node_modules
        id: android-nm
        uses: actions/cache@v6
        with:
          path: android/node_modules
          key: android-nm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('android/package-lock.json') }}
      # android imports ../src/shared, which resolves deps from the root node_modules
      - run: bun install --frozen-lockfile --ignore-scripts
      - if: steps.android-nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: android
      - run: bun test android/test
      - run: bun run typecheck:android

      - name: has android sdk?
        id: sdk
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
      - name: android sdk (only if the runner lacks one)
        if: steps.sdk.outputs.present != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: prebuild + debug APK
        working-directory: android
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          ./gradlew :app:assembleDebug -Dorg.gradle.jvmargs=-Xmx4g --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk

  # Builds the Swift transcription helper (the slow part of a release) only when stt/ changes,
  # so a broken helper shows up on the PR instead of at release time. On main it also seeds the
  # SwiftPM build cache that release.yml (tag builds can read main's caches) restores.
  mac-stt:
    name: "Inkfish · CI · mac stt helper · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) || github.ref_name || github.event_name }}"
    needs: changes
    if: needs.changes.outputs.stt == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.INKFISH_MAC_RUNNER == '')
    runs-on: ${{ vars.INKFISH_MAC_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: select xcode
        run: bash .github/scripts/select-xcode.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: restore SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: stt/.build
          key: stt-${{ runner.os }}-${{ runner.arch }}-${{ vars.INKFISH_MAC_RUNNER || 'xcode-27' }}-${{ hashFiles('stt/Package.swift', 'stt/Package.resolved') }}-${{ hashFiles('stt/Sources/**') }}
          restore-keys: stt-${{ runner.os }}-${{ runner.arch }}-${{ vars.INKFISH_MAC_RUNNER || 'xcode-27' }}-${{ hashFiles('stt/Package.swift', 'stt/Package.resolved') }}-
      # plain node: imports only, no bun install needed
      - run: bun scripts/build-stt.ts --force
      - run: ls -la stt/bin && file stt/bin/inkfish-stt
      # Smoke the per-app audio listing (Core Audio metadata only, no TCC prompt needed).
      - name: smoke audio-apps
        run: stt/bin/inkfish-stt audio-apps
      # Best effort: targeted tap with no matching app should announce RATE and wait (silence), not crash.
      # Hosted runners have no TCC grant, so this only reports what happens.
      - name: smoke tap --apps (informational)
        continue-on-error: true
        run: |
          (stt/bin/inkfish-stt tap --apps com.example.none > /dev/null 2> tap.err & echo $! > tap.pid; sleep 4; kill "$(cat tap.pid)" 2>/dev/null) || true
          cat tap.err

  mac-onnx:
    name: "Inkfish · CI · managed ONNX runtime · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('manual · {0}', github.ref_name) || github.ref_name || github.event_name }}"
    needs: changes
    if: needs.changes.outputs.onnx == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository || vars.INKFISH_MAC_RUNNER == '')
    runs-on: ${{ vars.INKFISH_MAC_RUNNER || 'xcode-27' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: select xcode
        run: bash .github/scripts/select-xcode.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: restore bun install cache
        if: env.CI_PERSISTENT_CACHE != '1'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      # Skip the root Electron download, then run only ONNX Runtime Node's native CPU installer.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node ./node_modules/onnxruntime-node/script/install
      - name: smoke native ONNX Runtime Node binding
        run: |
          node --input-type=module -e 'import { InferenceSession } from "onnxruntime-node"; if (typeof InferenceSession?.create !== "function") throw new Error("ONNX Runtime binding did not load"); console.log("ONNX Runtime Node", process.versions.node, "binding loaded")'
      - run: bun test src/main/onnx-managed.test.ts src/shared/lfm-catalog.test.ts src/shared/intel-runtime.test.ts
