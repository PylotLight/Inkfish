# shuttle-build: Inkfish Android release pipeline (k8s-native, no EAS)
#
# Pieces:
#   keystore-init-job.yaml  one-shot: creates the release keystore on the
#                           `shuttle-build-cache` PVC (skips if it exists).
#                           Run once. Afterwards mirror it into the PERMANENT
#                           shared `android-release-keystore` Secret (values
#                           copied base64-to-base64 — key material never
#                           leaves the cluster):
#                             kubectl -n shuttle-build get secret inkfish-android-keystore -o json | python3 -c "
#                             import json,sys
#                             d = json.load(sys.stdin)
#                             data = d['data']; data['keystore'] = data.pop('inkfish.keystore')
#                             print(json.dumps({'apiVersion':'v1','kind':'Secret','type':'Opaque',
#                               'metadata':{'name':'android-release-keystore','namespace':'shuttle-build',
#                                 'annotations':{'inkfish.dev/permanent':'true',
#                                   'inkfish.dev/purpose':'Shared Android release signing keystore. DO NOT DELETE OR ROTATE.'}},
#                               'data':data}))" | kubectl apply -f -
#                           Keys: keystore (file), store-password, key-password,
#                           key-alias. NEVER delete or rotate it — Android
#                           upgrades require the same signing key. Future apps
#                           reuse this keystore (new alias per app via keytool).
#   build-job.yaml          clones the branch, npm ci, expo prebuild, injects
#                           signing (inject-signing.sh), gradle assembleRelease.
#                           APK lands at /cache/output/ on the PVC; copy it out:
#                             kubectl cp <pod>:/cache/output/app-release.apk ./Inkfish.apk
#
# Caches on the PVC (shared across builds):
#   /cache/npm      npm cache        (npm ci --cache)
#   /cache/gradle   GRADLE_USER_HOME (AGP deps, wrapper dists)
#   /cache/keystore keystore backup (source of truth is the k8s Secret)
#   /cache/output   finished APKs
apiVersion: batch/v1
kind: Job
metadata:
  name: inkfish-keystore-init
  namespace: shuttle-build
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: shuttle-build-cache
      containers:
        - name: init
          image: reactnativecommunity/react-native-android:v21.1
          volumeMounts:
            - name: cache
              mountPath: /cache
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              mkdir -p /cache/keystore /cache/output /cache/npm /cache/gradle
              if [ -f /cache/keystore/inkfish.keystore ]; then
                echo "keystore already exists on PVC — nothing to do"
                exit 0
              fi
              rand() { openssl rand -base64 32 | tr -d '/+=\n' | cut -c1-24; }
              STOREPASS="$(rand)"
              KEYPASS="$(rand)"
              keytool -genkeypair \
                -keystore /cache/keystore/inkfish.keystore \
                -alias inkfish -keyalg RSA -keysize 2048 -validity 9125 \
                -storepass "$STOREPASS" -keypass "$KEYPASS" \
                -dname "CN=Inkfish, OU=PylotLight, O=PylotLight, C=US"
              printf 'STORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=inkfish\n' \
                "$STOREPASS" "$KEYPASS" > /cache/keystore/creds.env
              chmod 600 /cache/keystore/inkfish.keystore /cache/keystore/creds.env
              echo "keystore created — mirror it into the inkfish-android-keystore Secret (see README)"
