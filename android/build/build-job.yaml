# Inkfish Android signed release build (k8s Job, EAS-free).
#
#   kubectl -n shuttle-build delete job inkfish-apk-build --ignore-not-found
#   kubectl -n shuttle-build apply -f build-job.yaml
#   kubectl -n shuttle-build wait --for=condition=complete job/inkfish-apk-build --timeout=3600s
#   ls -la android/build/output/app-release.apk   # already there — no fetch step
#
# Requires the `android-release-keystore` Secret (see keystore-init-job.yaml).
# Re-run for a fresh APK: delete the job first (completions are one-shot):
#   kubectl -n shuttle-build delete job inkfish-apk-build
#
# The finished APK drops straight into the repo's android/build/output/ via
# the `out` hostPath mount (/Data is shared with the node). No kubectl cp.
apiVersion: batch/v1
kind: Job
metadata:
  name: inkfish-apk-build
  namespace: shuttle-build
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: shuttle-build-cache
        - name: keystore
          secret:
            secretName: android-release-keystore
            items:
              - key: keystore
                path: inkfish.keystore
        - name: out
          hostPath:
            path: /Data/files/repos/inkfish/android/build/output
            type: Directory
      containers:
        - name: build
          image: reactnativecommunity/react-native-android:v21.1
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "6"
              memory: 12Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: keystore
              mountPath: /keystore
              readOnly: true
            - name: out
              mountPath: /out
          env:
            - name: BRANCH
              value: main
            - name: CI
              value: "1"
            - name: GRADLE_USER_HOME
              value: /cache/gradle
            - name: KEYSTORE_FILE
              value: /keystore/inkfish.keystore
            - name: STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: android-release-keystore
                  key: store-password
            - name: KEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: android-release-keystore
                  key: key-password
            - name: KEY_ALIAS
              valueFrom:
                secretKeyRef:
                  name: android-release-keystore
                  key: key-alias
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
              git clone --branch "${BRANCH:-main}" --depth 1 \
                https://github.com/PylotLight/Inkfish.git /src
              # Stamp expo version + android versionCode from the repo release
              # version (root package.json) — same MAJOR·10000+MINOR·100+PATCH
              # rule as .github/workflows/android-release.yml, so cluster builds
              # install as upgrades over GitHub builds instead of downgrades.
              # Override with VERSION=X.Y.Z for one-off test builds.
              V="${VERSION:-$(python3 -c "import json;print(json.load(open('/src/package.json'))['version'])")}"
              [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version '$V'"; exit 1; }
              IFS=. read -r MA MI PA <<< "$V"
              CODE=$((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))
              python3 - "$V" "$CODE" <<'PYEOF'
              import json, sys
              v, code = sys.argv[1], int(sys.argv[2])
              p = '/src/android/app.json'
              doc = json.load(open(p))
              doc['expo']['version'] = v
              doc['expo']['android']['versionCode'] = code
              json.dump(doc, open(p, 'w'), indent=2)
              open(p, 'a').write('\n')
              PYEOF
              echo "Inkfish Android $V (versionCode $CODE)"
              cd /src/android
              npm ci --cache /cache/npm --no-audit --no-fund
              chmod +x build/inject-signing.sh
              npx expo prebuild --platform android --clean
              ./build/inject-signing.sh
              cd android
              ./gradlew :app:assembleRelease \
                -Dorg.gradle.jvmargs=-Xmx4g \
                -Dorg.gradle.caching=true \
                --console=plain
              APK=/cache/output/app-release.apk
              cp app/build/outputs/apk/release/app-release.apk "$APK"
              BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
              "$BT"apksigner verify --print-certs "$APK" | head -8
              "$BT"aapt2 dump badging "$APK" | grep -o "package: name='[^']*' versionCode='[^']*' versionName='[^']*'"
              # Straight into the repo's standard out dir via the /out hostPath
              # mount. The job runs as root — hand ownership back to whoever
              # owns the dir so the next build/dev can overwrite it.
              cp "$APK" /out/app-release.apk
              chown --reference=/out /out/app-release.apk || chmod 644 /out/app-release.apk
              ls -la "$APK" /out/app-release.apk
              echo "BUILD OK: $APK"
